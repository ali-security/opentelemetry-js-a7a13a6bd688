name: Unit Tests
on:
  workflow_dispatch:

jobs:
  node-tests:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "23"
          - "24"
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      # npm@12 requires {"node":"^22.22.2 || ^24.15.0 || >=26"} and did not exist at
      # release time; cap at the 11.x line that was current for this release.
      - run: npm install -g npm@"<12.0.0"
        if: ${{
          matrix.node_version == '20' ||
          matrix.node_version == '22' ||
          matrix.node_version == '23' ||
          matrix.node_version == '24'
          }}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - run: npm test
        if: ${{ matrix.node_version != '22' && matrix.node_version != '23' && matrix.node_version != '24' }}
      # Node.js >= 23 type stripping conflicts with mocha usage of ts-node.
      # See https://github.com/open-telemetry/opentelemetry-js/issues/5415
      # Node.js 22.18+ backported type stripping and enables it by default too,
      # so the '22' leg (setup-node now resolves 22.x >= 22.18) needs the same flag.
      - run: npm test
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
        if: ${{ matrix.node_version == '22' || matrix.node_version == '23' || matrix.node_version == '24' }}

      # Package the release tarball for @opentelemetry/core. Upstream only packs
      # inside publish-to-npm.yml (which needs the NPM_TOKEN secret), so the pack
      # + upload happen here, on the leg matching the release runtime.
      - name: Pack @opentelemetry/core
        if: ${{ matrix.node_version == '23' }}
        run: |
          mkdir -p dist-pack
          npm pack --workspace=packages/opentelemetry-core --pack-destination=./dist-pack
          mv ./dist-pack/opentelemetry-core-*.tgz "./dist-pack/core-$(node -p "require('./packages/opentelemetry-core/package.json').version").tgz"
          ls -l ./dist-pack

      - name: Upload @opentelemetry/core tarball
        if: ${{ matrix.node_version == '23' }}
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-core-tgz
          path: ./dist-pack/core-*.tgz
          if-no-files-found: error

  node-windows-tests:
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      # npm@12 requires {"node":"^22.22.2 || ^24.15.0 || >=26"} and did not exist at
      # release time; cap at the 11.x line that was current for this release.
      - run: npm install -g npm@"<12.0.0"

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
        run: npm run test
  browser-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
